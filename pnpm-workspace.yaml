packages:
  - "apps/*"
  - "packages/*"

# pnpm 10+ reads install settings from THIS file, not from the `pnpm` key in
# package.json — it emits one `[WARN]` line and then ignores that key. The
# repo pins pnpm 9, which reads only package.json, so both copies exist on
# purpose during the transition (#295).
#
# Dropping either side is a silent failure, not an error: the security
# overrides revert to whatever transitive ranges ask for and an audit ignore
# (`auditConfig.ignoreGhsas`, none at present) stops applying. `pnpm settings:check`
# fails the build when the two drift apart. An audit ignore also needs a
# pnpm-audit exception in security/exceptions.json (owner, versions, reason,
# review deadline), or the security scans fail.
#
# Justification + removal trigger for every entry below:
#   docs/en/security/dependency-overrides.md

overrides:
  "@graphql-tools/utils@11": "^12.0.3"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  "brace-expansion@1": "^1.1.16"
  "brace-expansion@5": "^5.0.8"
