# Security scans (P07 task 8.1, ADR-0017 §5): pnpm audit (high and critical), gitleaks over the checked-out tree and
# Trivy over the production images. Not part of every PR in the private repository (ADR-0017).
#
# - Every push of a public CI mirror branch (`ci/**`, scripts/ci-mirror.mjs, ADR-0018): each mirrored commit gets a
#   run record. The release pipeline (scripts/public-release.mjs) requires a successful run of this workflow on the
#   mirror commit of the exact tree it releases. scripts/ci-mirror.mjs `report` reads only ci.yml's run.
# - Nightly: `schedule` runs on the default branch (on the public repository: the latest release).
# - By hand (`workflow_dispatch`) or from another workflow (`workflow_call`), on main, a mirror branch or a tag only.
#
# The scanners run through scripts/security-scanners.mjs with configuration from outside the tree: a scanner
# configuration file in the tree (.gitleaks.toml, .gitleaksignore, .trivyignore, trivy.yaml, …) fails the scan,
# GITLEAKS_* / TRIVY_* / npm_config_* variables are dropped, and pnpm audit runs without the project's audit ignores
# and against the public registry. scripts/check-security-scan.mjs then decides each result from the JSON report and
# security/exceptions.json: a finding no valid exception covers, or an expired exception, fails; a scanner or a
# service behind it that is unavailable (no complete report) is "not completed" — the job fails, it never passes.
# No secrets are used and the logs print no matched secret text (gitleaks runs with --redact; findings are reported
# by place and review id). See docs/dev/security-scanning.md.
#
# Third-party actions are pinned to full commit SHAs, as in ci.yml. The scanners are release binaries pinned by
# version and SHA-256 (from each release's checksums file, checked 2026-10-23); update both together (gitleaks also
# in ci.yml), never to an unverified build. scripts/__tests__/security-workflow.test.mjs guards this file.
name: Security scans

on:
  push:
    branches: ['ci/**']
  schedule:
    - cron: '17 18 * * *' # 02:17 Asia/Shanghai
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  PNPM_VERSION: 9.12.0
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  TRIVY_VERSION: 0.75.0
  TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f

jobs:
  ref:
    name: Trusted ref (main, a public CI mirror branch or a release tag)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse other refs
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/main|refs/heads/ci/*|refs/tags/v*) echo "scanning $REF" ;;
            *) echo "security scans run on main, ci/* or v* tags only, not on $REF"; exit 1 ;;
          esac

  exceptions:
    name: Exceptions are complete and none has expired
    needs: ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ steps.check.outputs.status }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: check
        run: node scripts/check-security-scan.mjs exceptions

  pnpm-audit:
    name: pnpm audit (high and critical; project audit ignores dropped)
    needs: ref
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      status: ${{ steps.scan.outputs.status || steps.check.outputs.status }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The lockfile only; nothing is installed.
      - id: scan
        run: node scripts/security-scanners.mjs audit --dir . --report "$RUNNER_TEMP/pnpm-audit.json"
      - id: check
        run: node scripts/check-security-scan.mjs pnpm-audit --report "$RUNNER_TEMP/pnpm-audit.json" --ignores-dropped

  gitleaks:
    name: gitleaks (secrets in the tree)
    needs: ref
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      status: ${{ steps.scan.outputs.status || steps.check.outputs.status }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }} (checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - id: scan
        run: node scripts/security-scanners.mjs gitleaks --dir . --report "$RUNNER_TEMP/gitleaks.json" --bin "$RUNNER_TEMP/gitleaks"
      - id: check
        run: node scripts/check-security-scan.mjs gitleaks --report "$RUNNER_TEMP/gitleaks.json" --scan-root .

  trivy:
    name: Trivy (${{ matrix.image }} image, high and critical)
    needs: ref
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cms
            build: docker build -f docker/Dockerfile -t heopress-cms:scan .
          - image: site-classic
            build: docker build -f docker/Dockerfile --target site-classic -t heopress-site-classic:scan .
          - image: postgres
            build: docker build -f docker/postgres/Dockerfile -t heopress-postgres:scan docker/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build the image
        run: ${{ matrix.build }}
      - name: Install Trivy ${{ env.TRIVY_VERSION }} (checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
      # The vulnerability database is downloaded here; when that service is unavailable Trivy exits non-zero and
      # the scan is not completed. Vulnerabilities without a fixed version count too: each needs a dated exception.
      - name: Scan
        run: node scripts/security-scanners.mjs trivy --dir . --image "heopress-${{ matrix.image }}:scan" --report "$RUNNER_TEMP/trivy.json" --bin "$RUNNER_TEMP/trivy"
      - name: Check
        run: node scripts/check-security-scan.mjs trivy --report "$RUNNER_TEMP/trivy.json" --image "${{ matrix.image }}"

  result:
    name: Security scan result (an unavailable scanner is not completed, never passed)
    if: always()
    needs: [ref, exceptions, pnpm-audit, gitleaks, trivy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every scan completed and passed
        env:
          REF_CHECK: ${{ needs.ref.result }}/
          EXCEPTIONS: ${{ needs.exceptions.result }}/${{ needs.exceptions.outputs.status }}
          PNPM_AUDIT: ${{ needs.pnpm-audit.result }}/${{ needs.pnpm-audit.outputs.status }}
          GITLEAKS: ${{ needs.gitleaks.result }}/${{ needs.gitleaks.outputs.status }}
          TRIVY: ${{ needs.trivy.result }}/
        run: |
          fail=0
          {
            echo '| Scan | Result |'
            echo '| --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"
          for scan in REF_CHECK EXCEPTIONS PNPM_AUDIT GITLEAKS TRIVY; do
            value="${!scan}"
            job="${value%%/*}"
            status="${value#*/}"
            if [ "$job" = success ]; then
              verdict=passed
            elif [ "$status" = failed ]; then
              verdict=failed; fail=1
            elif [ "$scan" = TRIVY ] && [ "$job" = failure ]; then
              verdict='failed or not completed (see each image job)'; fail=1
            else
              verdict="not completed ($job)"; fail=1
            fi
            echo "$scan: $verdict"
            echo "| $scan | $verdict |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$fail"
