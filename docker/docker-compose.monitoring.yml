version: '3.8'

services:
  # Prometheus metrics are off by default (P02 5.1); the scrape target needs them.
  cms:
    environment:
      HEOPRESS_ENABLE_METRICS: "true"

  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheusdata:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'

  grafana:
    image: grafana/grafana:10.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafanadata:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    volumes:
      - lokidata:/loki

  pg-backup:
    image: prodrigestivill/postgres-backup-local:16
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: heopress
      POSTGRES_USER: heopress
      POSTGRES_PASSWORD: heopress_dev
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "0"
      # Needs the `s3` profile (SeaweedFS) and a `heopress-backups` bucket.
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: heopress-backups
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-heopress}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-heopress}
    volumes:
      - backupdata:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  prometheusdata:
  grafanadata:
  lokidata:
  backupdata:
