groups:
  - name: heopress-cache
    rules:
      - alert: HeoPressCacheHighErrorRate
        expr: |
          (
            sum(rate(heopress_cache_operations_total{result=~"error|unavailable"}[5m]))
            /
            sum(rate(heopress_cache_operations_total[5m]))
          ) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: HeoPress cache error rate above 50%
          description: >-
            More than half of cache operations are failing over the last 5 minutes.
            Check PostgreSQL connectivity (the cache is the lumibase_cache_entries table) and recent deploy changes.

      - alert: HeoPressCacheLowHitRate
        expr: |
          (
            sum(rate(heopress_cache_operations_total{result="hit"}[15m]))
            /
            sum(rate(heopress_cache_operations_total{op=~"get|getEntry"}[15m]))
          ) < 0.5
        for: 10m
        labels:
          severity: info
        annotations:
          summary: HeoPress cache hit ratio below 50%
          description: >-
            Positive cache hit ratio has been below 50% for 10 minutes. This may
            be expected after a cold start or large invalidation burst.

      - alert: HeoPressCacheInvalidationFailures
        expr: sum(rate(heopress_cache_operations_total{op="invalidateByTag",result="error"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: HeoPress cache tag invalidation errors
          description: invalidateByTag operations are failing — stale content may persist until TTL expiry.
