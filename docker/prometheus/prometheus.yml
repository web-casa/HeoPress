global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: 'heopress-cms'
    metrics_path: /metrics
    static_configs:
      - targets: ['cms:1989']
        labels:
          service: 'heopress-cms'
